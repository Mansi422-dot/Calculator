<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A responsive calculator built using HTML, CSS and JavaScript."
    >

    <title>Calculator | HTML CSS JavaScript</title>

    <link rel="stylesheet" href="C:\CyberSecurity\Projects\Calculator\calc.css">
</head>

<body>

    <main class="calculator">
        <input
            type="text"
            class="display"
            id="display"
            value="0"
            aria-label="Calculator display"
            readonly
        >

        <div class="keys">

            <button class="button clear" data-action="clear">AC</button>
            <button class="button delete" data-action="delete">DEL</button>
            <button class="button operator" data-value="%">%</button>
            <button class="button square" data-action="square">x²</button>

            <button class="button number" data-value="7">7</button>
            <button class="button number" data-value="8">8</button>
            <button class="button number" data-value="9">9</button>
            <button class="button operator" data-value="/">÷</button>

            <button class="button number" data-value="4">4</button>
            <button class="button number" data-value="5">5</button>
            <button class="button number" data-value="6">6</button>
            <button class="button operator" data-value="*">×</button>

            <button class="button number" data-value="1">1</button>
            <button class="button number" data-value="2">2</button>
            <button class="button number" data-value="3">3</button>
            <button class="button operator" data-value="-">−</button>

            <button class="button number zero" data-value="0">0</button>
            <button class="button decimal" data-value=".">.</button>
            <button class="button equal" data-action="calculate">=</button>
            <button class="button operator" data-value="+">+</button>

        </div>
    </main>

    <script src="C:\CyberSecurity\Projects\Calculator\calc.js"></script>
</body>
</html>
